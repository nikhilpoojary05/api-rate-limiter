server:
  port: 8082

spring:
  application:
    name: admin-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ratelimiter_admin}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

jwt:
  # No default: the service must not start without an explicitly configured key.
  secret: ${JWT_SECRET}

management:
  # Actuator runs on its own port, never published outside the Docker network.
  # Spring Cloud Gateway's GlobalFilter does not apply to actuator endpoints, so
  # the JWT filter cannot protect them — keeping them off the public port is the
  # only reliable boundary.
  server:
    port: ${MANAGEMENT_PORT:9082}

  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

  # Spans go to Zipkin at ZIPKIN_URL; Compose sets it and turns sampling on. Sampling is
  # off by default so a local run without Zipkin does not keep failing to send spans.
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.0}
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_URL:http://localhost:9411/api/v2/spans}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html