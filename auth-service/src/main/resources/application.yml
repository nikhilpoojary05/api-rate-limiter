server:
  port: 8081

spring:
  application:
    name: auth-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ratelimiter_auth}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: false
    out-of-order: false
    baseline-on-migrate: false

  data:
    redis:
      host: localhost
      port: 6379

jwt:
  # No default: the service must not start without an explicitly configured key.
  secret: ${JWT_SECRET}
  access-token-expiry-ms: 900000
  refresh-token-expiry-ms: 604800000

management:
  # Actuator runs on its own port, never published outside the Docker network.
  # Spring Cloud Gateway's GlobalFilter does not apply to actuator endpoints, so
  # the JWT filter cannot protect them — keeping them off the public port is the
  # only reliable boundary.
  server:
    port: ${MANAGEMENT_PORT:9081}

  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html