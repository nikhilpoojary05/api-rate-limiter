# Load balancer for docker-compose.distributed.yml: spreads requests across every
# gateway replica. Docker's DNS returns one address per replica for "gateway-service",
# and nginx round-robins across all of them. It resolves the name once at startup, so
# restart this container if you change the replica count.
upstream gateways {
    # Shared round-robin state. Without it each nginx worker (one per CPU) rotates on its
    # own, and every worker's first pick is the same instance: light traffic, spread over
    # the workers, all landed on one gateway.
    zone gateways 64k;
    server gateway-service:8080;
    keepalive 64;
}

# Logs which replica served each request, so the spread can be checked.
log_format upstream '$remote_addr "$request" $status upstream=$upstream_addr';

server {
    listen 8080;
    access_log /var/log/nginx/access.log upstream;

    # Overwrite, never append: the gateways trust this header for the client IP (see
    # docker-compose.distributed.yml), so a client must not be able to set it.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Host $host;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # The dashboard's live event stream: pass events through as they arrive.
    location /api/admin/analytics/live {
        proxy_pass http://gateways;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://gateways;
    }
}
