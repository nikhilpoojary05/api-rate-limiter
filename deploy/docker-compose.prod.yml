# Production overrides, used with Caddy in front (see docs/deploy.md):
#
#   docker compose -f docker-compose.yml -f deploy/docker-compose.prod.yml up -d --build
services:
  gateway-service:
    # Loopback only: the gateway is reached through Caddy, never directly. That is also
    # what makes trusting X-Forwarded-For safe: only Caddy can reach the gateway, and
    # Caddy overwrites the header with the real client address.
    ports: !override
      - "127.0.0.1:${GATEWAY_PORT:-8080}:8080"
    environment:
      SERVER_FORWARD_HEADERS_STRATEGY: native
