server:
  port: 8090

spring:
  application:
    name: gateway-service

  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin

      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods: "*"
            allowedHeaders: "*"

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

jwt:
  secret: ${JWT_SECRET:SuperSecretKeyForJwtSigningThatIsAtLeast256BitsLong!!}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,gateway

  endpoint:
    health:
      show-details: always

  tracing:
    sampling:
      probability: 1.0

springdoc:
  api-docs:
    path: /v3/api-docs

  swagger-ui:
    path: /swagger-ui.html

gateway:
  routes:
    auth-service-uri: ${AUTH_SERVICE_URI:http://localhost:8081}
    admin-service-uri: ${ADMIN_SERVICE_URI:http://localhost:8082}
    demo-service-uri: ${DEMO_SERVICE_URI:http://localhost:8083}

logging:
  level:
    com.ratelimiter: DEBUG
    org.springframework.cloud.gateway: INFO