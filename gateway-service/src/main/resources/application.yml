server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: gateway-service

  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin

      globalcors:
        corsConfigurations:
          '[/**]':
            # Explicit origins, not "*": a wildcard cannot carry credentials and let
            # any site on the internet call these endpoints.
            allowedOrigins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
            allowedMethods: [GET, POST, PUT, DELETE, OPTIONS]
            allowedHeaders: [Authorization, Content-Type, Accept]
            allowCredentials: true
            maxAge: 3600

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Short, so a Redis outage fails requests closed at once instead of holding them
      # (see RedisConfig). Redis normally answers in well under a millisecond.
      timeout: ${REDIS_TIMEOUT:1s}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:1s}

ratelimit:
  # Requests that use more than one unit of the caller's limit, by path prefix; the
  # longest match wins and everything else costs 1. /api/demo/slow holds a thread for
  # half a second, so it is charged as five ordinary requests.
  costs:
    "[/api/demo/slow]": 5

security:
  hsts:
    # Enable together with TLS termination. Turning this on over plain http locks
    # browsers out of the host.
    enabled: ${SECURITY_HSTS_ENABLED:false}

jwt:
  # No default: the service must not start without an explicitly configured key.
  secret: ${JWT_SECRET}

management:
  # Actuator runs on its own port, never published outside the Docker network.
  # Spring Cloud Gateway's GlobalFilter does not apply to actuator endpoints, so
  # the JWT filter cannot protect them — keeping them off the public port is the
  # only reliable boundary.
  server:
    port: ${MANAGEMENT_PORT:9080}

  endpoints:
    web:
      exposure:
        # "gateway" deliberately excluded: it exposes route topology and supports writes
        include: health,info,metrics,prometheus

  endpoint:
    health:
      show-details: when-authorized

  # Spans go to Zipkin at ZIPKIN_URL; Compose sets it and turns sampling on. Sampling is
  # off by default so a local run without Zipkin does not keep failing to send spans.
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.0}
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_URL:http://localhost:9411/api/v2/spans}

springdoc:
  api-docs:
    path: /v3/api-docs

  swagger-ui:
    path: /swagger-ui.html

gateway:
  routes:
    auth-service-uri: ${AUTH_SERVICE_URI:http://localhost:8081}
    admin-service-uri: ${ADMIN_SERVICE_URI:http://localhost:8082}
    demo-service-uri: ${DEMO_SERVICE_URI:http://localhost:8083}

logging:
  level:
    com.ratelimiter: DEBUG
    org.springframework.cloud.gateway: INFO